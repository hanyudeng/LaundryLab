spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/laundrylab?serverTimezone=UTC}
    username: ${DB_USER:laundrylab}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: never
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:false}
server:
  port: ${PORT:8080}
app:
  line:
    channel-secret: ${LINE_CHANNEL_SECRET:}
    channel-access-token: ${LINE_CHANNEL_ACCESS_TOKEN:}
    bot-url: ${LINE_BOT_URL:}
  signal-key: ${SIGNAL_API_KEY:}
  auth:
    allowed-email-domain: ${SCHOOL_EMAIL_DOMAIN:o365.fcu.edu.tw}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
    mail-from: ${MAIL_FROM:no-reply@laundrylab.local}
    secure-cookie: ${AUTH_SECURE_COOKIE:true}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
